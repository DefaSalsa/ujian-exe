name: Build Windows

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependensi
        run: npm install

      - name: Buat ikon
        run: npx tauri icon app-icon.png --fit contain

      - name: Build
        run: npm run tauri build

      - name: Kumpulkan file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item src-tauri/target/release/UjianMAN.exe package/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe package/

      # Artifact ini didownload sebagai UjianMAN.zip (berisi exe dan installer)
      - uses: actions/upload-artifact@v4
        with:
          name: UjianMAN
          path: package/
